name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole workflow on the tag commit.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "22.12.0" is the floor from package.json engines (held by
        # tests/unit/nodeFloor.test.ts); 22, 24 and 26 are the latest of each line.
        node: ["22.12.0", "22", "24", "26"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Prettier over src/ and tests/ (generated tools excepted, .prettierignore).
      - run: npm run format:check
      - run: npm test
      # Same command downstream consumers build with (prebuild: lint + typecheck + unit tests, then tsc).
      - run: npm run build
      # Starts dist/index.js over stdio and checks initialize with the 2024-11-05
      # to 2025-11-25 revisions and a client pinned to 2026-07-28, and that a
      # `.env` is loaded without any dotenv output on stdout (dummy key,
      # unreachable API base).
      - run: npm run test:stdio
      - run: npm audit --omit=dev --audit-level=high
      # Lists the tools of dist/index.js over stdio with a dummy key and an
      # unreachable API base; the count must equal the contract snapshot.
      - run: node scripts/smoke-stdio.mjs

  mcpb:
    name: mcpb bundle
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      # As in the release build job: no install scripts (N-76).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Validates mcpb/manifest.json with the pinned MCPB CLI and builds the
      # bundle and SBOMs from the lockfile (scripts/build-mcpb.sh).
      - run: npm run build:mcpb
      # Unpacks the bundle and runs the stdio smoke against its dist/index.js
      # and bundled node_modules.
      - name: Smoke the unpacked bundle
        run: |
          dir="$(mktemp -d)"
          unzip -q release/*.mcpb -d "$dir"
          cd "$dir"
          node "$GITHUB_WORKSPACE/scripts/smoke-stdio.mjs"

  # Secret scan (audit N-53): gitleaks over the full git history with the
  # default rules and the allowlist in .gitleaks.toml. gitleaks comes from its
  # GitHub release, pinned by version and SHA-256 (asset
  # gitleaks_<version>_linux_x64.tar.gz, value from that release's
  # gitleaks_<version>_checksums.txt). To upgrade, change both together.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version and SHA-256)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          rm -f "$archive"
          ./gitleaks version
      - name: Scan the full git history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
